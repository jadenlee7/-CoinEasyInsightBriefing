name: YouTube Editorial Validation

on:
  pull_request:
    paths:
      - '.github/workflows/youtube-editorial-validation.yml'
      - 'Dockerfile'
      - 'coineasy_brand/**'
      - '코인이지 브리핑/coineasy-briefing-bot/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 코인이지 브리핑/coineasy-briefing-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 코인이지 브리핑/coineasy-briefing-bot/package-lock.json
      # No provider credentials, OAuth, Redis, TTS requests or uploads in CI.
      # The production renderer uses the pinned optional native canvas binary;
      # legacy node-canvas install scripts are not needed by these tests.
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: git diff --check
